name: Release Please

# IMPORTANT: This workflow requires ONE of the following to be configured:
#
# Option 1 (Recommended): Enable repository setting to allow GitHub Actions to create PRs
#   Settings > Actions > General > Workflow permissions
#   ✓ "Allow GitHub Actions to create and approve pull requests"
#
# Option 2 (Alternative): Use a Personal Access Token (PAT) or GitHub App token
#   1. Create a PAT with 'repo' and 'workflow' scopes
#   2. Add it as a repository secret (e.g., RELEASE_PLEASE_TOKEN)
#   3. Update the 'token' parameter below to use: ${{ secrets.RELEASE_PLEASE_TOKEN }}
#
# Without one of these configurations, the workflow will fail with:
# "GitHub Actions is not permitted to create or approve pull requests"
#
# See: https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/enabling-features-for-your-repository/managing-github-actions-settings-for-a-repository

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: release-please-oss/release-please-action@v5
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      # Checkout code if a release was created
      - name: Checkout
        if: steps.release.outputs.releases_created == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        if: steps.release.outputs.releases_created == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        if: steps.release.outputs.releases_created == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cache Node modules
        if: steps.release.outputs.releases_created == 'true'
        uses: actions/cache@v5
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        if: steps.release.outputs.releases_created == 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Run GoReleaser
        if: steps.release.outputs.releases_created == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
