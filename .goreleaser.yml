# GoReleaser configuration for Allstar-Nexus
# This configuration builds multi-platform binaries with embedded frontend assets

version: 2

before:
  hooks:
    # Build frontend assets before creating releases
    - make build-dashboard

builds:
  - id: allstar-nexus
    main: .
    binary: allstar-nexus
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      # Skip ARM builds on macOS and Windows
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    ldflags:
      - -s -w
      - -X main.buildVersion={{.Version}}
      - -X main.buildTime={{.Date}}

archives:
  - id: allstar-nexus
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - config.yaml.example

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: dbehnke
    name: allstar-nexus
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Allstar-Nexus {{ .Tag }}

    Release {{ .Tag }} - {{ .Date }}
  footer: |
    ## Installation

    Download the appropriate archive for your platform, extract it,
    and run the binary.

    For configuration, see the included sample config file or visit
    the [documentation](https://github.com/dbehnke/allstar-nexus).
