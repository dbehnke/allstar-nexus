# GoReleaser configuration for Allstar-Nexus
# This configuration builds multi-platform binaries with embedded frontend assets

version: 2

before:
  hooks:
    # Build frontend assets before creating releases
    - make build-dashboard

builds:
  - id: allstar-nexus
    main: .
    binary: allstar-nexus
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      # Skip ARM builds on macOS and Windows
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    ldflags:
      - -s -w
      - -X main.buildVersion={{.Version}}
      - -X main.buildTime={{.Date}}

archives:
  - id: allstar-nexus
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - config.yaml.example
      - allstar-nexus.service

nfpms:
  - id: allstar-nexus
    package_name: allstar-nexus
    homepage: https://github.com/dbehnke/allstar-nexus
    maintainer: David Behnke <dbehnke@gmail.com>
    description: Amateur Radio Node Management System for AllStarLink
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: config.yaml.example
        dst: /etc/allstar-nexus/config.yaml
        type: config
        file_info:
          mode: 0644
      - src: allstar-nexus.service
        dst: /etc/systemd/system/allstar-nexus.service
        type: config
        file_info:
          mode: 0644
      - dst: /var/lib/allstar-nexus
        type: dir
        file_info:
          mode: 0755
          owner: allstar-nexus
          group: allstar-nexus
    scripts:
      preinstall: scripts/preinstall.sh
      postinstall: scripts/postinstall.sh
      preremove: scripts/preremove.sh
      postremove: scripts/postremove.sh
    overrides:
      deb:
        dependencies:
          - systemd
      rpm:
        dependencies:
          - systemd

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: dbehnke
    name: allstar-nexus
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Allstar-Nexus {{ .Tag }}

    Release {{ .Tag }} - {{ .Date }}
  footer: |
    ## Installation

    ### Binary Installation (All Platforms)
    Download the appropriate archive for your platform, extract it,
    and run the binary.

    ### Debian/Ubuntu (.deb package)
    ```bash
    sudo dpkg -i allstar-nexus_*_linux_amd64.deb
    # Edit configuration
    sudo nano /etc/allstar-nexus/config.yaml
    # Enable and start service
    sudo systemctl enable allstar-nexus
    sudo systemctl start allstar-nexus
    ```

    ### RedHat/CentOS (.rpm package)
    ```bash
    sudo rpm -i allstar-nexus_*_linux_amd64.rpm
    # Edit configuration
    sudo nano /etc/allstar-nexus/config.yaml
    # Enable and start service
    sudo systemctl enable allstar-nexus
    sudo systemctl start allstar-nexus
    ```

    For configuration details, see the included sample config file or visit
    the [documentation](https://github.com/dbehnke/allstar-nexus).
